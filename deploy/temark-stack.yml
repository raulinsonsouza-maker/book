# Stack separado da landing Temark — não altera o serviço book_web.
# Na VPS:
#   cd /opt/apps/temark-landing
#   docker build -t temark-landing:latest .
#   docker stack deploy -c deploy/temark-stack.yml temark

version: "3.8"

services:
  landing:
    image: temark-landing:latest
    networks:
      - traefik_proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 3s
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_proxy
        - traefik.http.routers.temark.rule=Host(`temark.com.br`) || Host(`www.temark.com.br`)
        - traefik.http.routers.temark.entrypoints=websecure
        - traefik.http.routers.temark.tls=true
        - traefik.http.routers.temark.tls.certresolver=letsencryptresolver
        - traefik.http.services.temark.loadbalancer.server.port=80
        - traefik.http.routers.temark-http.rule=Host(`temark.com.br`) || Host(`www.temark.com.br`)
        - traefik.http.routers.temark-http.entrypoints=web
        - traefik.http.routers.temark-http.middlewares=temark-https-redirect
        - traefik.http.middlewares.temark-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.temark-https-redirect.redirectscheme.permanent=true

networks:
  traefik_proxy:
    external: true
